<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evelly · 15 Anos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- Reset e Estilos Globais --- */
        :root {
            --bg-top: #fdeef2;
            --bg-bot: #f6cedb;
            --blush: #fbe7ec;
            --line: #d98aa4;
            --rose: #d68aa0;
            --rose-deep: #b45c78;
            --ink: #7a4256;
            --paper: #fffafb;
            --shadow: rgba(180, 92, 120, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            background: linear-gradient(180deg, var(--bg-top) 0%, #fbe0e8 45%, var(--bg-bot) 100%);
            font-family: 'Cormorant Garamond', serif;
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Layout Principal --- */
        .page {
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .frame {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 250, 251, 0.6);
            backdrop-filter: blur(2px);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(180, 92, 120, 0.2);
            padding: 10px;
        }

        /* --- Molduras Decorativas --- */
        .frame-border,
        .frame-border-inner {
            position: absolute;
            border: 1px solid var(--line);
            opacity: 0.4;
            pointer-events: none;
            border-radius: 12px;
        }
        .frame-border {
            inset: 0;
        }
        .frame-border-inner {
            inset: 6px;
            opacity: 0.25;
        }

        .frame-inner {
            position: relative;
            padding: 40px 20px 30px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Elementos Decorativos Flutuantes (Ambient) --- */
        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .deco {
            position: absolute;
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(8deg);
            }
        }
        .pearl {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff, #f2c9d6 80%);
            box-shadow: 0 2px 6px var(--shadow);
        }
        .heart-ico {
            color: #f0b7c7;
        }

        /* --- Laços e Flores (SVG) --- */
        .flourish {
            position: absolute;
            z-index: 2;
            opacity: 0.7;
        }
        .fl-top {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .fl-bottom {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .corner-bow {
            position: absolute;
            width: 50px;
            z-index: 3;
            filter: drop-shadow(0 2px 4px var(--shadow));
        }
        .cb-tl {
            top: -12px;
            left: -12px;
            transform: rotate(-15deg);
        }
        .cb-tr {
            top: -12px;
            right: -12px;
            transform: rotate(15deg) scaleX(-1);
        }
        .cb-bl {
            bottom: -12px;
            left: -12px;
            transform: rotate(15deg) scaleY(-1);
        }
        .cb-br {
            bottom: -12px;
            right: -12px;
            transform: rotate(-15deg) scale(-1, -1);
        }

        .menu-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fffdfd;
            border: 1px solid var(--shadow);
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.1);
        }
        .menu-btn svg {
            width: 16px;
            height: 16px;
        }

        /* --- Cena do Envelope --- */
        #envelope-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        .envelope-wrap {
            position: relative;
            width: 260px;
            height: 200px;
            perspective: 1400px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 15px;
        }

        .env-corner-bow {
            position: absolute;
            width: 35px;
            z-index: 6;
            filter: drop-shadow(0 2px 4px var(--shadow));
        }
        .ecb-tl {
            top: -12px;
            left: -10px;
            transform: rotate(-20deg);
        }
        .ecb-tr {
            top: -12px;
            right: -10px;
            transform: rotate(20deg) scaleX(-1);
        }
        .ecb-bl {
            bottom: -12px;
            left: -10px;
            transform: rotate(20deg) scaleY(-1);
        }
        .ecb-br {
            bottom: -12px;
            right: -10px;
            transform: rotate(-20deg) scale(-1, -1);
        }

        .letter-peek {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            height: 130px;
            background: var(--paper);
            border: 1px solid var(--shadow);
            z-index: 1;
            transform: translateY(0);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1) 0.1s;
            border-radius: 4px;
        }

        .envelope-body {
            position: absolute;
            inset: 0;
            background: var(--blush);
            border: 1px solid var(--line);
            z-index: 2;
            border-radius: 6px;
            box-shadow: 0 8px 20px var(--shadow);
        }

        .flap-3d {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 110px;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.6, -0.1, 0.25, 1);
            z-index: 4;
        }
        .flap-shape {
            position: absolute;
            inset: 0;
            background: var(--blush);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            backface-visibility: hidden;
            border-radius: 6px 6px 0 0;
        }
        .flap-3d svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            backface-visibility: hidden;
        }

        .seal-group {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .seal-group svg {
            display: block;
            width: 80px;
            height: auto;
        }

        .tap-cursor {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            animation: tapmove 1.8s ease-in-out infinite;
            opacity: 0.7;
        }
        @keyframes tapmove {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 0.7;
            }
            50% {
                transform: translateX(-50%) translateY(8px);
                opacity: 0.3;
            }
        }

        .envelope-wrap.opening .flap-3d {
            transform: rotateX(178deg);
        }
        .envelope-wrap.opening .seal-group {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
        }
        .envelope-wrap.opening .letter-peek {
            transform: translateY(-320px) scale(1.02);
        }
        .envelope-wrap.opening .tap-cursor {
            opacity: 0;
        }

        .envelope-hint {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            font-size: 11px;
            color: var(--rose-deep);
            opacity: 0.7;
            text-align: center;
            margin-top: 8px;
        }

        /* --- Conteúdo do Convite --- */
        #invitation {
            position: relative;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.9s ease 0.3s;
            width: 100%;
            text-align: center;
        }
        #invitation.show {
            opacity: 1;
            max-height: 1500px;
            overflow: visible;
        }

        .card-inner {
            position: relative;
            padding: 10px 10px 20px;
        }

        .top-bow {
            width: 120px;
            margin: 0 auto 5px;
            display: block;
        }

        .eyebrow-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 4px;
        }
        .eyebrow-line .rule {
            height: 1px;
            width: 45px;
            background: linear-gradient(90deg, transparent, var(--rose-deep), transparent);
        }
        .eyebrow-line .heart {
            color: var(--rose-deep);
            font-size: 12px;
        }

        .years {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.3em;
            font-size: 18px;
            font-weight: 500;
            color: var(--rose-deep);
            margin: 4px 0 8px;
        }

        .name {
            font-family: 'Alex Brush', cursive;
            font-size: 64px;
            line-height: 1;
            color: var(--rose);
            margin: 0 0 4px;
            text-shadow: 0 2px 12px var(--shadow);
        }

        .name-divider {
            width: 90px;
            margin: 0 auto 16px;
            opacity: 0.7;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.02em;
            max-width: 280px;
            margin: 0 auto 22px;
            color: var(--ink);
        }

        .date-block {
            margin: 0 auto 20px;
        }
        .month {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.3em;
            font-size: 13px;
            color: var(--rose-deep);
            margin-bottom: 2px;
        }
        .date-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .date-row .rule {
            height: 1px;
            width: 40px;
            background: var(--rose-deep);
            opacity: 0.5;
        }
        .day-big {
            font-family: 'Cinzel', serif;
            font-size: 52px;
            font-weight: 500;
            color: var(--rose-deep);
            line-height: 1;
        }
        .side-label {
            font-size: 15px;
            letter-spacing: 0.15em;
            color: var(--ink);
        }
        .year-row {
            margin-top: 4px;
            font-size: 15px;
            letter-spacing: 0.15em;
            color: var(--rose-deep);
        }

        .venue {
            background: var(--rose);
            color: #fff;
            padding: 14px 20px;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 0.1em;
            line-height: 1.8;
            max-width: 280px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px -12px var(--rose-deep);
            border-radius: 4px;
        }

        .rsvp-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .rsvp-divider .rule {
            height: 1px;
            width: 35px;
            background: var(--rose-deep);
            opacity: 0.4;
        }

        .rsvp {
            font-size: 15px;
            letter-spacing: 0.03em;
            line-height: 1.6;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .btn {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: #fff;
            background: var(--rose-deep);
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 20px -8px var(--rose-deep);
            width: 100%;
            max-width: 240px;
            text-align: center;
        }
        .btn:hover {
            transform: translateY(-3px);
            background: #a24e69;
            box-shadow: 0 12px 28px -8px var(--rose-deep);
        }
        .btn.ghost {
            background: transparent;
            color: var(--rose-deep);
            border: 1px solid var(--rose-deep);
            box-shadow: none;
        }
        .btn.ghost:hover {
            background: rgba(180, 92, 120, 0.08);
            transform: translateY(-2px);
        }

        /* --- Responsividade --- */
        @media (max-width: 400px) {
            .frame-inner {
                padding: 30px 12px 20px;
            }
            .name {
                font-size: 52px;
            }
            .day-big {
                font-size: 44px;
            }
            .envelope-wrap {
                width: 220px;
                height: 170px;
            }
            .letter-peek {
                height: 110px;
            }
            .flap-3d {
                height: 90px;
            }
            .seal-group {
                top: 88px;
            }
            .seal-group svg {
                width: 70px;
            }
            .envelope-wrap.opening .letter-peek {
                transform: translateY(-270px) scale(1.02);
            }
            .corner-bow {
                width: 40px;
            }
            .env-corner-bow {
                width: 30px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .flap-3d,
            .letter-peek,
            #invitation,
            .tap-cursor,
            .deco {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Elementos de fundo (perolas e corações) -->
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <div class="page">
        <div class="frame">
            <div class="frame-border"></div>
            <div class="frame-border-inner"></div>

            <!-- Flores no topo e base -->
            <svg class="flourish fl-top" width="60" height="14" viewBox="0 0 60 14" aria-hidden="true">
                <path d="M2 7 C12 7 12 2 22 2 C28 2 28 7 30 7 C32 7 32 2 38 2 C48 2 48 7 58 7" fill="none" stroke="#c46e8c" stroke-width="1"/>
                <circle cx="30" cy="7" r="2" fill="#e79cb4"/>
            </svg>
            <svg class="flourish fl-bottom" width="60" height="14" viewBox="0 0 60 14" aria-hidden="true">
                <path d="M2 7 C12 7 12 12 22 12 C28 12 28 7 30 7 C32 7 32 12 38 12 C48 12 48 7 58 7" fill="none" stroke="#c46e8c" stroke-width="1"/>
                <circle cx="30" cy="7" r="2" fill="#e79cb4"/>
            </svg>

            <!-- Laços nos cantos -->
            <svg class="corner-bow cb-tl" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
            <svg class="corner-bow cb-tr" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
            <svg class="corner-bow cb-bl" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
            <svg class="corner-bow cb-br" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>

            <!-- Botão Menu (recomeçar) -->
            <div class="menu-btn" id="menuBtn" title="Recomeçar" aria-label="Recomeçar">
                <svg viewBox="0 0 24 24" fill="none" stroke="#b45c78" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </div>

            <div class="frame-inner">

                <!-- ====== CENA DO ENVELOPE ====== -->
                <div id="envelope-scene">
                    <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Abrir convite">

                        <svg class="env-corner-bow ecb-tl" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
                        <svg class="env-corner-bow ecb-tr" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
                        <svg class="env-corner-bow ecb-bl" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>
                        <svg class="env-corner-bow ecb-br" viewBox="0 0 100 70" aria-hidden="true"><use href="#bowIcon"/></svg>

                        <div class="letter-peek"></div>
                        <div class="envelope-body"></div>

                        <div class="flap-3d" id="flap3d">
                            <div class="flap-shape"></div>
                            <svg viewBox="0 0 260 110" preserveAspectRatio="none">
                                <polyline points="1,1 130,108 259,1" fill="none" stroke="#c46e8c" stroke-width="1" opacity="0.6"/>
                            </svg>
                        </div>

                        <div class="seal-group" id="sealGroup">
                            <svg viewBox="0 0 100 65" aria-hidden="true">
                                <defs>
                                    <radialGradient id="sealGrad" cx="35%" cy="30%" r="75%">
                                        <stop offset="0%" stop-color="#eeb1c3"/>
                                        <stop offset="65%" stop-color="#c6748f"/>
                                        <stop offset="100%" stop-color="#a85870"/>
                                    </radialGradient>
                                </defs>
                                <g fill="#eda6bc">
                                    <path d="M50 35 C35 12 12 12 12 28 C12 50 35 42 50 35 Z"/>
